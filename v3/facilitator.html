<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진행자 집계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 진행자 집계: 학습자가 제출한 라운드 결과 코드를 붙여 넣으면 반 전체를 보여 준다. 서버 없이 이 브라우저에서만 계산한다. */
:root{--bg:#E7E9E6;--panel:#FBFBFA;--sunk:#F0F1EE;--ink:#151615;--muted:#666A63;--line:#E3E5E1;--accent:#DDF46A;--good:#2E7D3A;--bad:#B4402F;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F110F;--panel:#1B1D1B;--sunk:#202320;--ink:#EFF1EC;--muted:#9A9F98;--line:#2B2E2A;--accent:#D4EE5E;--good:#7ED08F;--bad:#F08A7A;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}
:root[data-theme="dark"]{--bg:#0F110F;--panel:#1B1D1B;--sunk:#202320;--ink:#EFF1EC;--muted:#9A9F98;--line:#2B2E2A;--accent:#D4EE5E;--good:#7ED08F;--bad:#F08A7A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
textarea{width:100%;min-height:120px;font:13px/1.4 ui-monospace,monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
button{font:inherit;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}button.main{background:var(--accent);border-color:var(--accent);color:#151615}
.note{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:5px 6px;border-top:1px solid var(--line);text-align:left}td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--s1);display:inline-block;vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.present .nick{filter:blur(6px)}
</style>
<style id="theme-v4">
/* 톤앤매너 v5 (2026-11-21): 게임 화면과 같은 딥 네이비 · 앰버 · 아이스 블루 */
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
:root,:root[data-theme="light"],:root[data-theme="dark"]{--bg:#05090C;--panel:#0E1A21;--sunk:#12232C;--ink:#E9EEF0;--muted:#8FA3AB;--line:#1F3540;--accent:#F0A020;--good:#8FCDD9;--bad:#F2917F;--s1:#8FCDD9;--s2:#F0A020;--s3:#457280;--s4:#D6CAAE;color-scheme:dark}
body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em;background:radial-gradient(900px 560px at 88% -8%,rgba(240,160,32,.20),transparent 62%),radial-gradient(1000px 640px at -6% 4%,rgba(69,114,128,.36),transparent 60%),#05090C;background-attachment:fixed}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.card{border:0;border-radius:22px;background:rgba(14,26,33,.78);box-shadow:inset 0 0 0 1px rgba(143,205,217,.12),0 24px 48px rgba(0,0,0,.4);padding:18px 20px}
textarea{border:0;background:rgba(5,12,16,.6);box-shadow:inset 0 0 0 1px rgba(143,205,217,.18);border-radius:16px}
textarea:focus{outline:none;box-shadow:inset 0 0 0 1.5px #8FCDD9}
button{border:0;background:rgba(143,205,217,.06);box-shadow:inset 0 0 0 1px rgba(143,205,217,.22);font-weight:600;padding:8px 16px}
button:hover{box-shadow:inset 0 0 0 1px rgba(143,205,217,.45)}
button.main{background:#F0A020;color:#0B0F12;box-shadow:0 0 0 1px rgba(255,214,140,.5),0 10px 28px rgba(240,160,32,.3)}
button.main:hover{background:#F7B23E}
th{color:var(--muted);font-weight:600;font-size:12.5px}
th,td{border-top-color:var(--line)}
.bar{border-radius:999px}
</style>
<div class="wrap">
 <h1>진행자 집계 · In-Tray v3</h1>
 <p class="note">학습자가 라운드 성적표나 결산에서 복사한 결과 코드(<code>IT3-R…</code>)를 한 줄에 하나씩 붙여 넣으세요. 코드에는 별칭, 스타일, 핵심 선택, 지표, 습관 점수만 들어 있고 쓴 글은 없습니다. 계산은 이 브라우저 안에서만 합니다.</p>
 <div class="card"><textarea id="in" placeholder="IT3-R1-eyJ2Ijoz...-1a2b"></textarea>
  <div class="row" style="margin-top:8px"><button class="main" id="go">집계하기</button><label class="row note"><input type="checkbox" id="pres"> 발표 모드 (별칭 가리기)</label><span class="note" id="msg"></span></div></div>
 <div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEYS={"M08":["M08 강태식 전화 (해외 공장 경고)",{"직":"직접 처리 (로그를 직접 봄)","답":"답장만","위":"맡김","코":"코칭","보":"보류","시":"시간 초과"}],"1-5":["첫 주간 회의",{A:"보고형",B:"토론형",C:"격주+1:1"}],pub:["KPI 기준 공개 수준",{A:"전체 공개",B:"항목만",C:"리더에게만"}],"3-8":["승인 안 된 AI 도구",{A:"즉시 신고",B:"먼저 파악 후 신고",C:"공개 조치 후 신고"}],"4-5":["헬씨푸드 운영비 요구 1단계",{A:"추정치라 밝힘",B:"3% + 2년",C:"신규 과제로 대신"}],"6-1":["하반기 계약",{A:"동결 + 실측",B:"5% 인하 + 우선 협상권",C:"동결 + 신규 2건"}],"5-4":["장애 공로 추천",{A:"생산",B:"두 모듈",C:"보류"}],"8-1a":["본사 차출 대응",{A:"그대로 보냄",B:"1명으로 협상",C:"파견으로"}],"R3-1a":["새벽 지휘",{A:"강태식 지휘",B:"직접 원격 지휘"}],"R3-1b":["3번 라인",{A:"정지 + 절차",B:"부분 가동",C:"우회 승인"}],"9-4":["헬씨푸드 재협상",{A:"오류 인정 + 검증",B:"운영비 깎아 줌",C:"조사 후 답",D:"산식부터"}],"6-4b":["지침 변경 알림",{A:"전원 재공지",B:"리더 통해",C:"평가 때"}],"12-3a":["나머지 구성원 평가",{A:"관찰 확인",B:"리더 의견대로",C:"KPI 순서"}]};
const STY={push:"추진형",care:"배려형",bal:"균형형"};const KPI=["고객","재무","구성원","서비스 안정","헬씨푸드 만족"];const AX=["① 맡기기","② 평가","③ 자원","④ 설명"];
function decode(line){const m=line.trim().match(/^IT3-R(\d)-([A-Za-z0-9_-]+)-([0-9a-f]{4})$/);if(!m)return null;const b=m[2];let h=0;for(const c of b)h=(h*31+c.charCodeAt(0))>>>0;if((h%65536).toString(16).padStart(4,"0")!==m[3])return{bad:"검사 값 불일치"};
 try{const j=JSON.parse(decodeURIComponent(escape(atob(b.replace(/-/g,"+").replace(/_/g,"/")))));j.r=+m[1];return j;}catch(e){return{bad:"해석 실패"};}}
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):"—";const med=a=>{if(!a.length)return "—";const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
function run(){
 const rows=$("in").value.split(/\s+/).filter(Boolean).map(decode);const ok=rows.filter(r=>r&&!r.bad),bad=rows.length-ok.length;
 $("msg").textContent=`${ok.length}개 읽음${bad?` · ${bad}개는 읽지 못함`:""}`;
 /* 같은 별칭·라운드는 마지막 코드만 쓴다 */
 const last={};ok.forEach(r=>{last[(r.nick||"?")+"|"+r.r]=r;});const D=Object.values(last);
 const rounds=[1,2,3].filter(r=>D.some(x=>x.r===r));let h="";
 rounds.forEach(R=>{const L=D.filter(x=>x.r===R);
  h+=`<div class="card"><h2>Round ${R} · ${L.length}명</h2><p class="note nick">별칭: ${L.map(x=>x.nick||"(없음)").join(", ")}</p><p class="note">소요 시간 중앙값 ${Math.round(med(L.map(x=>x.t||0))/60)}분</p><div class="grid">`;
  /* 핵심 선택 분포 + 반 인생극장 */
  Object.keys(KEYS).forEach(k=>{const g={};L.forEach(x=>{const v=(x.ch||{})[k];if(v==null)return;const c=String(v)[0];(g[c]=g[c]||[]).push(x);});const cs=Object.keys(g).sort();if(!cs.length)return;
   h+=`<div><b>${KEYS[k][0]}</b><table><tr><th>선택</th><th>명</th>${KPI.map(x=>`<th>${x}</th>`).join("")}</tr>${cs.map(c=>`<tr><td>${c}. ${KEYS[k][1][c]||""}</td><td class="n">${g[c].length} <span class="bar" style="width:${Math.round(g[c].length/L.length*36)}px"></span></td>${KPI.map((_,i)=>`<td class="n">${avg(g[c].map(x=>x.kpi[i]))}</td>`).join("")}</tr>`).join("")}</table><p class="note">반 인생극장: 같은 결정에서 다른 길을 고른 동료들의 라운드 끝 지표 평균</p></div>`;});
  if(L.some(x=>(x.ch||{}).cells)){const g={};L.forEach(x=>{const c=(x.ch||{}).cells;if(!c)return;const top=["RUN","AI","GROW","SEC"][[...c].map(Number).indexOf(Math.max(...[...c].map(Number)))];(g[top]=g[top]||[]).push(x);});
   h+=`<div><b>여력 배분 (가장 많이 놓은 칸)</b><table><tr><th>칸</th><th>명</th>${KPI.map(x=>`<th>${x}</th>`).join("")}</tr>${Object.keys(g).map(c=>`<tr><td>${c}</td><td class="n">${g[c].length}</td>${KPI.map((_,i)=>`<td class="n">${avg(g[c].map(x=>x.kpi[i]))}</td>`).join("")}</tr>`).join("")}</table></div>`;}
  /* 받은편지함 처리 방식 (이번 라운드) */
  if(L.some(x=>x.ib&&x.ib.some(v=>v>0))){const I=L.filter(x=>x.ib);const s=i=>I.reduce((a,x)=>a+(x.ib[i]||0),0);const tot=[0,1,3,4].reduce((a,i)=>a+s(i),0)||1;const dl=s(1);
   h+=`<div><b>받은편지함 처리 방식</b><table><tr><th>처리</th><th>건수(반 전체)</th><th>비율</th></tr>${[["직접 처리·답장",0],["위임",1],["코칭",3],["보류",4]].map(([n,i])=>`<tr><td>${n}</td><td class="n">${s(i)}</td><td class="n">${Math.round(s(i)/tot*100)}%</td></tr>`).join("")}</table><p class="note">위임 ${dl}건 중 4요소(기대 결과·기한·권한·이유)를 켠 위임 ${s(2)}건 (${dl?Math.round(s(2)/dl*100):0}%). 전화로 들어온 건은 직접 답장에 포함됩니다.</p></div>`;}
  /* M39: 심리적 안전이 50 이상일 때만 도착하는 메일 */
  if(L.some(x=>x.m39!=null)){const g={1:[],0:[]};L.forEach(x=>{if(x.m39!=null)g[x.m39].push(x);});
   h+=`<div><b>M39 (김 사원 · 근태 밖 야간 경고 확인) 도착</b><table><tr><th></th><th>명</th>${KPI.map(x=>`<th>${x}</th>`).join("")}</tr>${[[1,"받음"],[0,"못 받음"]].map(([k,n])=>`<tr><td>${n}</td><td class="n">${g[k].length}</td>${KPI.map((_,i)=>`<td class="n">${avg(g[k].map(x=>x.kpi[i]))}</td>`).join("")}</tr>`).join("")}</table><p class="note">팀의 심리적 안전이 50 이상인 팀장에게만 도착합니다. 못 받은 사람은 결산 2쪽 '보내지 않은 메시지'에서 이 메일을 처음 봅니다.</p></div>`;}
  /* 서술형 미리 보기 · 토큰 */
  if(L.some(x=>x.rb)){const ns=L.flatMap(x=>x.rb||[]);const c=k=>ns.filter(v=>v===k).length;
   h+=`<div><b>서술형 미리 보기 (3요소 자동 점검)</b><p>답안 ${ns.length}건 · 3/3 ${c(3)}건 · 2/3 ${c(2)}건 · 1/3 이하 ${c(1)+c(0)}건</p><p class="note">① 기준·원칙 ② 상대 맥락 ③ 다음 행동·기한을 낱말로 점검한 예비 판정입니다. 최종 채점은 응답 묶음으로 강사가 합니다.</p></div>`;}
  if(L.some(x=>x.tk)){const g={};L.forEach(x=>{if(!x.tk)return;(g[x.tk[1]]=g[x.tk[1]]||[]).push(x);});
   h+=`<div><b>토큰 한도별 사용량과 효율</b><table><tr><th>한도</th><th>명</th><th>쓴 토큰</th><th>효율</th><th>재무</th></tr>${Object.keys(g).sort((a,b)=>a-b).map(c=>{const A=g[c];const eff=A.filter(x=>x.tk[0]>0).map(x=>Math.round((x.kpi[0]+x.kpi[3])/2/(x.tk[0]/10)*10)/10);return `<tr><td>💳${c}</td><td class="n">${A.length}</td><td class="n">${avg(A.map(x=>x.tk[0]))}</td><td class="n">${eff.length?(eff.reduce((a,b)=>a+b,0)/eff.length).toFixed(1):"—"}</td><td class="n">${avg(A.map(x=>x.kpi[1]))}</td></tr>`;}).join("")}</table><p class="note">효율 = (고객 + 서비스 안정) ÷ 2 ÷ (쓴 토큰 ÷ 10). 학습자 성적표 ② 탭의 '토큰 효율'과 같은 식입니다.</p></div>`;}
  /* 되돌리기 (2026-11-22) */
  if(L.some(x=>x.ud!=null)){const g=[[0,0,"0회"],[1,2,"1~2회"],[3,999,"3회 이상"]].map(([a,b,n])=>[n,L.filter(x=>x.ud!=null&&x.ud>=a&&x.ud<=b)]);
   h+=`<div><b>이전 장면으로 되돌리기</b><table><tr><th>횟수</th><th>명</th><th>참가자</th></tr>${g.map(([n,A])=>`<tr><td>${n}</td><td class="n">${A.length}</td><td>${n==="0회"?"":A.map(x=>(x.nick||"익명")+(x.ud?` (${x.ud})`:"")).join(", ")}</td></tr>`).join("")}</table><p class="note">되돌린 장면과 순서는 각 참가자의 성적표 요약에 있습니다. 결정을 바꾼 이유를 피드백 시간에 물어보세요.</p></div>`;}
  /* 스타일별 */
  const sg={};L.forEach(x=>{(sg[x.style]=sg[x.style]||[]).push(x);});
  h+=`<div><b>스타일별 지표 평균</b><table><tr><th>스타일</th><th>명</th>${KPI.map(x=>`<th>${x}</th>`).join("")}</tr>${Object.keys(sg).map(s=>`<tr><td>${STY[s]||s}</td><td class="n">${sg[s].length}</td>${KPI.map((_,i)=>`<td class="n">${avg(sg[s].map(x=>x.kpi[i]))}</td>`).join("")}</tr>`).join("")}</table></div>`;
  /* 4축 */
  h+=`<div><b>네 축 평균 · 스스로 본 나 vs 실제 행동</b><table><tr><th>축</th><th>자가진단</th><th>실제 행동</th><th>차이</th></tr>${[1,2,3,4].map(a=>{const s=avg(L.map(x=>x.ax&&x.ax.self?x.ax.self[a]:null).filter(v=>v!=null)),v=avg(L.map(x=>x.ax&&x.ax.act?x.ax.act[a]:null).filter(v=>v!=null));const d=typeof s==="number"&&typeof v==="number"?v-s:"—";return `<tr><td>${AX[a-1]}</td><td class="n">${s}</td><td class="n">${v}</td><td class="n" style="color:${d<-15?"var(--bad)":"inherit"}">${d}</td></tr>`;}).join("")}</table><p class="note">실제 행동이 자가진단보다 15 넘게 낮은 축이 반 전체의 맹점 후보입니다.</p></div>`;
  if(R===1){const g2=L.filter(x=>x.g2).length;h+=`<div><b>학습 목표 ② (기준 설계) 자동 판정</b><p>${g2}/${L.length}명 충족</p></div>`;}
  h+=`</div></div>`;});
 $("out").innerHTML=h||'<div class="card note">읽은 코드가 없습니다.</div>';
}
$("go").onclick=run;$("pres").onchange=e=>document.body.classList.toggle("present",e.target.checked);
</script>
