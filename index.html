<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>F사 운영팀 첫 해</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 사내 그룹웨어 셸. 회사 시스템은 산세리프로, 사람이 하는 말은 명조로 쓴다. */
/* 톤앤매너: 연한 회색 위의 반투명 흰 카드, 큰 반경, 그림자로 나눈 면, 라임 주 버튼, 민트 상태 알약, 사선 빗금 */
:root{
  --bg:#E7E9E6; --bg2:#F3F4F2; --panel:#FBFBFA; --glass:rgba(255,255,255,.72); --sunk:#F0F1EE; --ink:#151615; --muted:#666A63; --line:#E3E5E1;
  --accent:#DDF46A; --accent-press:#CDE84F; --accent-soft:#F2FAD2; --accent-ink:#55700C; --on-accent:#151615;
  --mint:#CFEFC4; --mint-ink:#2E6A28; --mint-bar:#9FD98C; --lav:#E3E4F1; --sage:#DFE9D9; --chip:#EDEEEB;
  --time:#9A5B06; --time-soft:#F7EBD2; --bad:#B4402F; --bad-soft:#F8E1DB; --good:#2E7D3A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --skin:#EBC9A6; --face-line:#2A2622; --h1:#2E3A52; --h2:#6A4A32; --h3:#3B3B3B; --h4:#8A5A7A; --h5:#B4562F; --tile:#E4E6E2;
  --shadow:0 1px 2px rgba(20,22,20,.04),0 10px 30px rgba(20,22,20,.07);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --hatch:repeating-linear-gradient(135deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --voice:var(--sans);
  --mono:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F110F; --bg2:#161816; --panel:#1B1D1B; --glass:rgba(30,33,30,.78); --sunk:#202320; --ink:#EFF1EC; --muted:#9A9F98; --line:#2B2E2A;
  --accent:#D4EE5E; --accent-press:#C3DE47; --accent-soft:#2A3215; --accent-ink:#CDE75C; --on-accent:#131512;
  --mint:#23402A; --mint-ink:#A5E092; --mint-bar:#5FA650; --lav:#25263A; --sage:#232D21; --chip:#262926;
  --time:#E9B05E; --time-soft:#3A2D17; --bad:#F08A7A; --bad-soft:#40221D; --good:#7ED08F; --tile:#2A2D29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 2px,transparent 2px 7px);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F110F; --bg2:#161816; --panel:#1B1D1B; --glass:rgba(30,33,30,.78); --sunk:#202320; --ink:#EFF1EC; --muted:#9A9F98; --line:#2B2E2A;
  --accent:#D4EE5E; --accent-press:#C3DE47; --accent-soft:#2A3215; --accent-ink:#CDE75C; --on-accent:#131512;
  --mint:#23402A; --mint-ink:#A5E092; --mint-bar:#5FA650; --lav:#25263A; --sage:#232D21; --chip:#262926;
  --time:#E9B05E; --time-soft:#3A2D17; --bad:#F08A7A; --bad-soft:#40221D; --good:#7ED08F; --tile:#2A2D29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 2px,transparent 2px 7px);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.voice{font-family:var(--voice);font-size:17px;line-height:1.75}
.note{font-size:13px;color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding-block:9px}
.who{min-width:0}.who b{display:block;font-size:14px}.who span{font-size:12.5px;color:var(--muted)}
.months{display:flex;gap:3px;flex:1 1 180px;max-width:300px}
.months i{flex:1;height:6px;background:var(--tile);border-radius:1px}
.months i.past{background:var(--accent)}.months i.now{background:var(--time)}
.res{display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto;align-items:center}
.r{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.r b{font-family:var(--mono);font-size:16px;color:var(--ink)}.r.over b{color:var(--bad)}
.clock{font-family:var(--mono);font-size:18px;color:var(--time);background:var(--time-soft);padding:2px 10px;border-radius:3px}
.clock.hot{color:var(--bad);background:var(--bad-soft)}
.tool{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.tool:hover{color:var(--ink)}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:14px;padding-block:14px 32px;align-items:start}
.people{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:14px;position:sticky;top:68px}
.leaders{display:grid;gap:9px;margin-top:8px}
.ld{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;align-items:center;position:relative}
.ld svg{width:40px;height:40px;display:block}
.ld b{font-size:13.5px;font-weight:600}.ld small{font-size:11.5px;color:var(--muted);margin-left:4px}
.tb{height:4px;background:var(--tile);margin-top:3px;border-radius:1px;overflow:hidden}
.tb i{display:block;height:100%;background:var(--accent);transition:width .35s}
.delta{position:absolute;right:0;top:0;font-family:var(--mono);font-size:12px;animation:rise 1.6s forwards}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
@keyframes rise{from{transform:translateY(5px)}to{transform:translateY(-4px)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.card{background:var(--sunk);padding:6px 8px;border-radius:3px}
.card span{display:block;font-size:11.5px;color:var(--muted)}.card b{font-family:var(--mono);font-size:17px}
.card em{font-style:normal;font-size:11px;color:var(--muted);display:block}

.view{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.mail{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);min-height:560px}
.list{border-right:1px solid var(--line);min-width:0;max-height:720px;overflow-y:auto}
.listhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1}
.item{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--sunk)}.item.on{background:var(--accent-soft)}
.item .top{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.item .sub{display:block;font-size:14px;font-weight:600;margin-top:1px}
.item.read .sub{font-weight:400}.item.done{color:var(--muted)}
.item .what{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.tag.ALERT{color:var(--bad);border-color:var(--bad)}.tag.DM{color:var(--accent);border-color:var(--accent)}
.reader{padding:18px 22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.back{display:none;font-size:13.5px;color:var(--accent);text-align:left}
.rhead h2{font-size:18px;line-height:1.4;text-wrap:balance}.rhead p{font-size:13px;color:var(--muted);margin-top:2px}
.body{max-width:62ch}
.attach{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px}
.ask{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:8px 16px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border:1px solid var(--line);border-radius:30px;font-size:14px}
.pick button svg{width:30px;height:30px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}.chk input{margin-top:5px}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.happen{background:var(--sunk);padding:10px 14px;border-radius:3px;font-size:15px}.happen .label{display:block;margin-bottom:2px}

.pane{padding:22px 26px;display:grid;gap:18px}
.eyebrow{font-size:12.5px;color:var(--muted)}
.pane h2{font-size:22px;line-height:1.4;text-wrap:balance}
.prose{display:grid;gap:12px;max-width:66ch;font-size:16px;line-height:1.8}
.say{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
.say svg{width:44px;height:44px}.say b{font-size:13px;color:var(--muted);font-weight:500;display:block}
.cond{display:grid;gap:4px;font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:3px;width:100%;align-items:start}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:not-allowed;color:var(--muted);background:var(--sunk)}
.opt .k{font-family:var(--mono);color:var(--muted)}
.cost{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--time)}
.why{grid-column:2/-1;font-size:13px;color:var(--bad)}
.link{color:var(--accent);text-decoration:underline;font-size:13px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ref{border:1px solid var(--line);border-radius:3px;padding:8px 12px;font-size:14px}
.ref summary{cursor:pointer;font-weight:500}
.table{display:grid;gap:6px}
.likert{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale button{min-width:44px;padding:4px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.task{border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.person{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:3px;align-items:center}
.person svg{width:44px;height:44px}.person:hover:not([disabled]){border-color:var(--ink)}
.person[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.person small{display:block;color:var(--muted);font-size:12.5px}
.person[disabled]{opacity:.55;cursor:not-allowed}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:3px;font-size:14px;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:15;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--panel);border-radius:4px;max-width:620px;margin:0 auto;padding:20px 22px;display:grid;gap:14px}
.ledger{display:grid;gap:8px}
.ledger div{border-bottom:1px solid var(--line);padding-bottom:8px}
.ledger small{display:block;color:var(--muted);font-size:12.5px}
.title-card{padding:48px 26px;display:grid;gap:18px;max-width:640px}
.title-card h1{font-size:32px;line-height:1.3;text-wrap:balance}
.aibox{border:1px dashed var(--line);background:var(--sunk);border-radius:4px;padding:12px 14px;margin:10px 0;display:grid;gap:4px}.aibox p{margin:0}.rawtab{display:grid;gap:2px;font-size:13.5px}.rawrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--panel);width:100%}.rawrow.head{background:transparent;border-color:transparent;color:var(--muted);font-size:12px}.rawrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.viz{width:100%;max-width:640px}.viz text{font-family:var(--mono);font-size:11px;fill:var(--muted)}.viz .lbl{font-family:var(--sans);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.vtip{font-size:13px;min-height:20px;color:var(--ink)}
pre.dev{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--sunk);padding:12px;border-radius:3px;max-height:320px;overflow:auto}

/* ===== 톤앤매너 덮어쓰기 ===== */
.item .tag{display:inline-block;min-height:0}
body{background:radial-gradient(1200px 600px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at 100% 0%,var(--bg2),transparent 55%),var(--bg);background-attachment:fixed;letter-spacing:-.005em}
.num,.r b,.card b,.clock,.cost,.opt .k,.tag,.delta{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-ink)}
.label{letter-spacing:0;font-weight:500;font-size:12px}
.bar{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:0;box-shadow:0 1px 0 var(--line)}
body::before{background:var(--glass)}
.who b{font-weight:700;letter-spacing:-.01em}
.months{gap:4px}.months i{height:8px;border-radius:999px;background:var(--tile);background-image:var(--hatch)}
.months i.past{background:var(--mint-bar)}.months i.now{background:var(--accent)}
.r b{font-weight:700;font-size:17px}
.clock{background:var(--mint);color:var(--mint-ink);border-radius:999px;padding:3px 12px;font-weight:600}
.clock.hot{background:var(--bad-soft);color:var(--bad)}
.shell{gap:16px;padding-block:16px 36px}
.people{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;top:76px}
.ld b{font-weight:600}
.tb{height:6px;border-radius:999px;background:var(--tile);background-image:var(--hatch)}.tb i{background:var(--mint-bar);border-radius:999px}
.cards{gap:8px}.card{background:var(--panel);border-radius:var(--r-sm);padding:8px 10px;box-shadow:0 1px 0 var(--line)}
.card b{font-weight:700;font-size:20px}
.view{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.list{border-right:0;background:rgba(0,0,0,.015);padding:6px}
.listhead{border-bottom:0;background:transparent;font-weight:500}
.item{border-bottom:0;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:4px;background:var(--panel)}
.item:hover{background:var(--sunk)}.item.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-press)}
.item.done{opacity:.7}
.tag{border:0;border-radius:999px;padding:1px 8px;font-weight:600;font-size:10.5px;background:var(--chip);color:var(--muted)}
.tag.ALERT{background:var(--bad-soft);color:var(--bad)}.tag.DM{background:var(--mint);color:var(--mint-ink)}.tag.MAIL{background:var(--lav);color:var(--ink)}.tag.TICKET{background:var(--sage);color:var(--ink)}
.reader{padding:22px 26px}.rhead h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.back{color:var(--accent-ink);font-weight:600}
.ask{border-top:0;padding-top:4px}
.btn{border:0;border-radius:999px;padding:11px 20px;background:var(--chip);font-weight:600;transition:background .15s,transform .05s}
.btn:hover{border:0;background:var(--line)}.btn:active{transform:translateY(1px)}
.btn.main{background:var(--accent);color:var(--on-accent);border:0}.btn.main:hover{background:var(--accent-press)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.pick button{border:0;background:var(--chip);border-radius:999px;padding:4px 14px 4px 4px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.happen{background:var(--sunk);border-radius:var(--r-md);padding:14px 16px}
.pane{padding:28px 30px;gap:20px}
.eyebrow{display:inline-block;justify-self:start;background:var(--chip);border-radius:999px;padding:3px 12px;font-weight:500}
.pane h2{font-size:26px;font-weight:700;letter-spacing:-.025em}
.cond{border-left:0;background:var(--sage);border-radius:var(--r-sm);padding:10px 14px;color:var(--ink);font-size:14px}
.cond span{display:block}
.opts{gap:10px}
.opt{border:0;background:var(--panel);border-radius:var(--r-md);padding:14px 16px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(20,22,20,.04);transition:box-shadow .15s,background .15s}
.opt:hover:not([disabled]){border:0;box-shadow:0 0 0 1.5px var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-press)}
.opt[disabled]{background:var(--sunk);box-shadow:none;background-image:var(--hatch)}
.opt .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:600;font-size:12px}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--on-accent)}
.cost{background:var(--time-soft);color:var(--time);border-radius:999px;padding:1px 9px;font-weight:600;font-size:12.5px;align-self:start}
.cost:empty{display:none}
.link{color:var(--accent-ink);font-weight:600}
.ref{border:0;background:var(--sunk);border-radius:var(--r-sm);padding:10px 14px}
.likert{border-bottom:0;background:var(--panel);border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
.scale button{border:0;background:var(--chip);border-radius:999px;padding:6px 14px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
